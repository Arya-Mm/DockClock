services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dockclock
      POSTGRES_PASSWORD: dockclock
      POSTGRES_DB: dockclock
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockclock"]
      interval: 2s
      retries: 30
  web:
    build: .
    depends_on: { db: { condition: service_healthy } }
    ports: ["3000:3000"]
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql://dockclock:dockclock@db:5432/dockclock
      DATABASE_URL_UNPOOLED: postgresql://dockclock:dockclock@db:5432/dockclock
      PAYPAL_ENV: sandbox
volumes:
  dbdata:
