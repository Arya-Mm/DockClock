services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dockclock
      POSTGRES_PASSWORD: dockclock
      POSTGRES_DB: dockclock
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockclock"]
      interval: 2s
      retries: 30
volumes:
  dbdata:
